name: Pluto Sign iOS Build Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve packages
        run: xcodebuild -project ios/PlutoSign.xcodeproj -scheme PlutoSign -resolvePackageDependencies
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/PlutoSign.xcodeproj \
            -scheme PlutoSign \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PlutoDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlutoSign-iOS-Simulator
          path: ${{ runner.temp }}/PlutoDerivedData/Build/Products/Debug-iphonesimulator/PlutoSign.app
          if-no-files-found: error
          retention-days: 7
